<!doctype html><html lang="id"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
/* Arah B, Tipografi raksasa: "C1" menjadi tokoh utama, maskot bersandar padanya. */
.glow{position:absolute;left:50%;top:640px;width:1100px;height:900px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(203,157,49,.28),transparent)}
.huge{position:absolute;left:-20px;top:430px;font-weight:900;font-size:560px;line-height:.8;letter-spacing:-34px;

  filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.huge-shadow{position:absolute;left:-20px;top:430px;font-weight:900;font-size:560px;line-height:.8;letter-spacing:-34px;color:transparent;-webkit-text-stroke:2px rgba(253,241,164,.35);transform:translate(16px,16px)}

.track{position:absolute;left:108px;right:108px;top:1060px;display:flex;align-items:center;gap:0}
.st{flex:none;text-align:center}
